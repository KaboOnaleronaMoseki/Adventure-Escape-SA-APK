services:
  - type: web
    name: adventure-escape-sa
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:server
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BOOKING_NOTIFICATION_CRON_SECRET
        sync: false
